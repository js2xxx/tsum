[package]
name = "tsum"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[workspace]
members = ["macros"]

[workspace.package]
version = "0.1.2"
edition = "2024"
description = "A type-level sum & union type library for Rust"
repository = "https://github.com/js2xxx/tsum"
license = "MIT OR Apache-2.0"
keywords = [
  "data-structure",
  "no-std",
  "sum-type",
  "type-level",
  "union-type"
]
categories = ["data-structures", "no-std"]

[dependencies]
tsum-macros = { path = "macros", version = "=0.1.2" }
typenum = "1.20.1"
