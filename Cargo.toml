[package]
name = "tsum"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[workspace]
members = ["macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "A type-level sum & union type library for Rust"
repository = "https://github.com/js2xxx/tsum"
license = "MIT OR Apache-2.0"
keywords = ["sum type", "type-level", "type-level programming", "union type"]
categories = ["data-structures", "type-level"]

[dependencies]
tsum-macros = { path = "macros", version = "=0.1.0" }
typenum = "1.20.1"
